<ion-card>
  <ion-card-header>
    <ion-card-title>Notification Settings</ion-card-title>
    <ion-card-subtitle>Not receiving notifications?</ion-card-subtitle>
  </ion-card-header>
  
  <ion-card-content>
    <p>If you're not receiving notifications, you can try refreshing your notification settings.</p>
    <p>This will generate a new notification token and register it with our servers.</p>
    
    <ion-button expand="block" (click)="refreshFCMToken()">
      <ion-icon name="refresh-outline" slot="start"></ion-icon>
      Refresh Notification Settings
    </ion-button>
  </ion-card-content>
</ion-card>
