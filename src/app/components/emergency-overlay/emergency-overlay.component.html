<div class="emergency-overlay">
  <div class="emergency-modal" [ngClass]="getSeverityClass()">
    
    <!-- Close Button -->
    <button class="close-button" (click)="dismiss()" type="button">
      <ion-icon name="close"></ion-icon>
    </button>
    
    <!-- Header -->
    <div class="modal-header">
      <div class="icon-container">
        <img [src]="getDisasterIcon()" [alt]="notification.category" class="disaster-icon">
        <span class="severity-badge">{{ getSeverityText() }}</span>
      </div>
      <h2 class="alert-title">EMERGENCY ALERT</h2>
      <h3 class="disaster-type">{{ notification.category.toUpperCase() }}</h3>
      
      <!-- Countdown -->
      <div class="countdown" *ngIf="timeRemaining > 0">
        {{ getFormattedTimeRemaining() }}
      </div>
    </div>

    <!-- Content -->
    <div class="modal-content">
      <h4 class="message-title">{{ notification.title }}</h4>
      <p class="message-text">{{ notification.message }}</p>
      
      <!-- Critical Instructions -->
      <div class="critical-info" *ngIf="isCritical()">
        <ion-icon name="warning"></ion-icon>
        <span>{{ getEmergencyInstructions() }}</span>
      </div>
    </div>

    <!-- Actions -->
    <div class="modal-actions">
      <button class="action-btn primary" (click)="viewMap()" type="button">
        <ion-icon name="map"></ion-icon>
        View Map
      </button>
      <button class="action-btn secondary" (click)="dismiss()" type="button">
        <ion-icon name="checkmark"></ion-icon>
        I'm Safe
      </button>
    </div>

    <!-- Footer -->
    <div class="modal-footer">
      <small>Alert issued: {{ notification.timestamp | date:'short' }}</small>
    </div>
  </div>
</div>
