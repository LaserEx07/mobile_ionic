<div class="emergency-overlay-container">
  <!-- Emergency Alert Container -->
  <div class="emergency-alert-container"
       [ngClass]="[getSeverityClass(), getDisasterClass()]">

    <!-- Emergency Header with Icon and Timer -->
    <div class="emergency-header">
      <!-- Disaster Icon -->
      <div class="disaster-icon-container">
        <img [src]="getDisasterIcon()"
             [alt]="notification.category + ' icon'"
             class="disaster-icon">
      </div>

      <!-- Emergency Title -->
      <div class="emergency-title-container">
        <h2 class="emergency-title">EMERGENCY ALERT</h2>
        <h1 class="disaster-type">{{ getDisplayDisasterType() }}</h1>
      </div>

      <!-- Countdown Timer -->
      <div class="countdown-container" *ngIf="timeRemaining > 0">
        <div class="countdown-circle">
          <span class="countdown-text">{{ getFormattedTimeRemaining() }}</span>
        </div>
      </div>
    </div>

    <!-- Emergency Content -->
    <div class="emergency-content">
      <!-- 1st Row: Title -->
      <div class="content-row title-row">
        <div class="row-label">ALERT NOTIFICATION!:</div>
        <div class="row-content">
          <div class="urgent-title">{{ notification.title }}</div>
          <div class="urgent-message">{{ getFormattedMessage() }}</div>
        </div>
      </div>

      <!-- 2nd Row: Priority Level -->
      <div class="content-row priority-row">
        <div class="row-label">Priority:</div>
        <div class="row-content priority-content">
          {{ getPriorityText() }}
        </div>
      </div>

      <!-- 3rd Row: Safety Tips -->
      <div class="content-row tips-row">
        <div class="safety-tips">
          {{ getEmergencyInstructions() }}
        </div>
      </div>
    </div>
  </div>

  <!-- Background Pattern for Visual Effect -->
  <div class="emergency-background-pattern" [ngClass]="getDisasterClass()"></div>
</div>
