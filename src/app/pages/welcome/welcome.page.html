<ion-content class="onboarding-bg">
  <div class="onboarding-wrapper">
    <!-- Skip button -->
    <div class="skip-container">
      <ion-button fill="clear" class="skip-btn" (click)="skipOnboarding()">
        SKIP
      </ion-button>
    </div>

    <!-- Illustration -->
    <div class="illustration-container">
      <img src="assets/ALERTO.png" alt="ALERTO" class="main-icon" />
    </div>

    <!-- Content -->
    <div class="content-container">
      <h2 class="onboarding-title">The Safe Zone</h2>
      <p class="onboarding-description">
        Disasters may strike without warning, but a well-known safe zone is your best defense against harm.
      </p>
    </div>

    <!-- Spacer to push bottom content down -->
    <div class="spacer"></div>

    <!-- Bottom section -->
    <div class="bottom-section">
      <!-- Page indicators -->
      <div class="indicators-container">
        <div class="indicator active"></div>
        <div class="indicator"></div>
        <div class="indicator"></div>
        <div class="indicator"></div>
      </div>

      <!-- Navigation buttons -->
      <div class="button-container">
        <div class="nav-buttons">
          <ion-button fill="clear" class="back-btn" (click)="previousPage()">
            BACK
          </ion-button>
          <ion-button expand="block" class="next-btn" (click)="nextPage()">
            NEXT
          </ion-button>
        </div>
      </div>
    </div>
  </div>
</ion-content>
